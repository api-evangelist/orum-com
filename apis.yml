x-evidence:
  harvested: '2026-08-04'
  request: >-
    Surfaced by the graph8 / Thomas Cornelius call 2026-08-04, where Orum was named as a
    power-dialer competitor. Catalog held only orum.io under the `orum` slug, so the dialer
    was entirely absent.
  probes:
  - https://www.orum.com/ -> HTTP 200 (orum.com redirects to www)
  - https://orum.com/llms.txt -> HTTP 404
  - https://orum.com/openapi.json -> HTTP 404
  - https://orum.com/.well-known/api-catalog -> HTTP 404
  - https://orum.com/mcp -> HTTP 404
  - https://orum.com/developers -> HTTP 404
  - https://orum.com/api -> HTTP 404
  - https://docs.orum.com -> DNS does not resolve (curl 000)
  - https://developers.orum.com -> DNS does not resolve (curl 000)
  - https://api.orum.com/openapi.json -> DNS does not resolve (curl 000)
  - https://app.orum.com -> DNS does not resolve (curl 000)
  - https://status.orum.com -> HTTP 200, components Dialer / Salesfloor / Analytics / Coaching
    suite, third-party Vonage Voice API + HubSpot API
  - https://trust.orum.com -> HTTP 200
  - https://support.orum.com/en-US/orum -> HTTP 200, help center only, no API articles found
  - https://www.orum.com/pricing -> HTTP 200, Launch + Ascend, contact-sales, 3-seat minimum
  - https://www.orum.com/platform/security -> HTTP 200, SOC 2 Type 2 + ISO 27001/27017/27018/27701
  - https://www.orum.com/{blog,about,careers,terms,privacy,responsible_disclosure} -> HTTP 200
  - https://www.orum.com/{data_processing_addendum,partners,customer-stories} -> HTTP 200
  - https://www.orum.com/{podcasts,reports-and-guides,platform/integrations} -> HTTP 200
  - https://github.com/orumcom -> HTTP 404 (no GitHub org found)
  - https://www.orum.com/software_and_services_agreement -> HTTP 404 (linked in footer, dead)
  - https://www.orum.com/oauth -> HTTP 404 (linked in nav as "Sign in", dead to a plain GET)
  findings:
    no_public_api: >-
      Zero public developer surface. No OpenAPI at any conventional path, no docs or developers
      host in DNS, no SDKs, no CLI, no MCP server, no llms.txt, no .well-known/api-catalog.
      `apis: []` is deliberate and correct — nothing was scaffolded or generated for this
      provider. Agent readiness will score 0.0 and that is the honest measurement.
    webhooks_undocumented: >-
      Webhooks are sold as a paid add-on on both plans and named as an integration method on the
      homepage, but no webhook payload, event list or endpoint documentation is publicly
      fetchable. This is the single cheapest thing Orum could publish.
    two_broken_footer_links: >-
      /software_and_services_agreement (footer, legal) and /oauth (nav, "Sign in") both 404 to a
      plain GET. Worth telling them if the relationship ever warrants it.
    competitive_claim_corrected: >-
      The graph8 call characterized Orum as "about $250 per seat, a year contract and a minimum
      of 10 seats." Orum's published pricing page shows no dollar figure, a 3-seat minimum, and
      a 500-dial free trial. Thomas's competitive framing does not match what Orum publishes.
