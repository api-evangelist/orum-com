aid: orum-com
name: Orum
description: >-
  Orum is an AI-powered sales calling and performance platform, marketed as "The Calling
  Performance System for Sales Teams" and "the AI-powered Live Conversation Platform to
  supercharge sales activity, connect teams, and drive more revenue." Its products are a
  parallel Dialer (up to 5 lines on the Launch plan, 10 on Ascend), Salesfloor for virtual
  co-selling, a Coaching and Enablement suite, Orum AI trained on a claimed one billion-plus
  sales calls, and Scout, a set of AI data agents. It positions itself as purpose-built for
  maximizing live conversations and explicitly distinct from the dialers built into CRMs and
  sales-engagement platforms, integrating instead with Salesforce, HubSpot, Outreach, Salesloft,
  Gong Engage and Apollo. Pricing is two named plans, Launch and Ascend, both contact-sales with
  a three-seat minimum and no published figures, plus a free trial capped at 500 dials; AI
  Coaching and Webhooks are paid add-ons. Orum publishes NO request API — no OpenAPI, no API
  reference, no developer portal, no SDKs, no CLI, no MCP server, no llms.txt, and
  api./docs./developers.orum.com do not resolve. Its one machine-facing contract is an outbound
  webhook, and contrary to the first profiling pass it IS publicly documented: a help-center
  article publishes the single `call-disposition-added` event, the `{event, payload, test}`
  envelope, HMAC-SHA256 signature verification over an `x-webhook-signature` header, a
  15-second ack timeout, an 8-attempt/30-minute exponential-backoff retry policy and three
  egress IPs. The article is simply unlinked from any directory and reachable only from the
  2025-04-14 launch blog post. Orum also publishes a dated product-update feed, a status page,
  a trust portal, a responsible-disclosure policy, Auth0-backed SSO (SAML/OIDC/OAuth 2.0), a
  Chrome extension, and SOC 2 Type 2 plus ISO 27001:2022, 27017:2015, 27018:2019 and
  27701:2019 attestations.
