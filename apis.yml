x-disambiguation: >-
  Slugged `orum-com` for orum.com, the AI sales dialer. NOT to be confused with `all/orum`,
  which is orum.io — an unrelated payments-infrastructure company (FedNow/RTP/ACH money
  movement and bank-account verification). Two different companies, near-identical names, same
  product-adjacent buyer. `all/orum` keeps its bare slug because it is already referenced by
  four published paper bundles and ~25k generated pages; per the domain-slug convention the TLD
  is appended only where needed to disambiguate, which is here.
